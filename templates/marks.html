<!DOCTYPE html>
<html>
<head>
    <title>Student Marks</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .marks-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 750px;
            margin: 30px auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 12px;
        }

        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .average {
            text-align: center;
            margin-top: 25px;
            font-size: 26px;
            font-weight: bold;
            color: #2563eb;
        }

        .grade {
            text-align: center;
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .button-container {
            text-align: center;
            margin-top: 25px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>AI Campus Operating System</h1>
    <p>Student Marks</p>
</header>

<div class="container">

    <div class="marks-box">

        <h2>📚 My Marks</h2>

        <table>

            <tr>
                <th>Subject</th>
                <th>Marks</th>
                <th>Grade</th>
            </tr>

            <tr>
                <td>Python</td>
                <td>78</td>
                <td>B+</td>
            </tr>

            <tr>
                <td>Java</td>
                <td>72</td>
                <td>B+</td>
            </tr>

            <tr>
                <td>DBMS</td>
                <td>85</td>
                <td>A</td>
            </tr>

            <tr>
                <td>DSA</td>
                <td>80</td>
                <td>A</td>
            </tr>

            <tr>
                <td>OOP</td>
                <td>75</td>
                <td>B+</td>
            </tr>

        </table>

        <div class="average">
            Average: 78%
        </div>

        <div class="grade">
            Overall Grade: B+
        </div>

        <div class="button-container">

            <a href="/student">
                <button>Back to Dashboard</button>
            </a>

        </div>

    </div>

</div>

</body>
</html>
