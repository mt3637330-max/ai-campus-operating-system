<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
        }

        .container {
            padding: 30px;
        }

        .attendance-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: 30px auto;
            text-align: center;
        }

        .percentage {
            font-size: 40px;
            font-weight: bold;
            color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>AI Campus Operating System</h1>
    <p>Student Attendance</p>
</header>

<div class="container">

    <div class="attendance-box">

        <h2>My Attendance</h2>

        <div class="percentage">85%</div>

        <p>Total Classes: 100</p>
        <p>Present: 85</p>
        <p>Absent: 15</p>

        <br>

        <a href="/student">
            <button>Back to Dashboard</button>
        </a>

    </div>

</div>

</body>
</html>
