<!DOCTYPE html>
<html>

<head>
    <title>Student Profile - AI Campus</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px 30px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 20px;
        }

        .profile {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .top {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .icon {
            font-size: 65px;
        }

        .top h2 {
            margin-bottom: 5px;
        }

        .top p {
            color: #666;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid #eee;
        }

        .label {
            font-weight: bold;
            color: #444;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #555;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<header>
    <h1>👨‍🎓 Student Profile</h1>
    <p>AI Campus Operating System</p>
</header>

<div class="container">

    <div class="profile">

        <div class="top">
            <div class="icon">👨‍🎓</div>

            <h2>Mahesh</h2>

            <p>B.Tech Computer Science & Engineering</p>
        </div>

        <div class="row">
            <span class="label">Name</span>
            <span>Mahesh</span>
        </div>

        <div class="row">
            <span class="label">Course</span>
            <span>B.Tech CSE</span>
        </div>

        <div class="row">
            <span class="label">Department</span>
            <span>Computer Science & Engineering</span>
        </div>

        <div class="row">
            <span class="label">Semester</span>
            <span>8th Semester</span>
        </div>

        <div class="row">
            <span class="label">Roll Number</span>
            <span>CSE-001</span>
        </div>

        <div class="row">
            <span class="label">Academic Year</span>
            <span>2026-27</span>
        </div>

        <a href="/student" class="back">
            ← Back to Student Dashboard
        </a>

    </div>

</div>

</body>

</html>
